                <!-- Controls Wrapper (Button + Selector) -->

                    <!-- Full Screen Button (ID used for toggling visibility on iOS) -->
                    <button id="fullscreenBtn" onclick="toggleFullScreen()" class="w-full md:w-auto px-6 py-3 bg-gray-800 hover:bg-red-600 text-white rounded-lg border border-gray-700 hover:border-red-500 transition-all duration-300 flex items-center justify-center gap-2 group shadow-lg cursor-pointer">

    <script>
        const _0x1 = [
            'jwpsrv.js', 'jwplayer.js', 'aHR0cHM6Ly9kZXhmbGl4LnBhZ2VzLmRldi9jaGFubmVscy5qcw=='
        ];
        
        const _0x2 = 'WFN1UDRxTWwrOXRLMTdRTmIrNCt0aDJQbTlBV2dNTy9jWUg4Q0kwSEdHcjdiZGpv';

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function initApp() {
            try {
                await loadScript(_0x1[0]);
                await loadScript(_0x1[1]);
                await loadScript(atob(_0x1[2]));
                jwplayer[atob('a2V5')] = atob(_0x2);
                
                // Function to detect iOS devices
                function isIOS() {
                    return [
                        'iPad Simulator', 'iPhone Simulator', 'iPod Simulator', 'iPad', 'iPhone', 'iPod'
                    ].includes(navigator.platform)
                    || (navigator.userAgent.includes("Mac") && "ontouchend" in document);
                }

                // Setup Fullscreen Toggle
                window.toggleFullScreen = function() {
                    const player = jwplayer("player");
                    if (player && typeof player.setFullscreen === 'function') {
                        player.setFullscreen(true);
                    } else {
                        const elem = document.getElementById("player");
                        if (elem.requestFullscreen) elem.requestFullscreen();
                        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
                    }
                };

                // Load Stream Logic
                window.loadStream = function(channelKey) {
                    if (typeof channels === 'undefined') return;
                    const channel = channels[channelKey];
                    if (!channel) return;

                    let fileUrl = channel.url;
                    let fileType = channel.type;
                    let drmConfig = undefined;

                    if (isIOS()) {
                        if (channel.iosUrl) {
                            fileUrl = channel.iosUrl;
                            fileType = 'hls';
                        } else if (channel.type === 'mpd') {
                            alert("Channel Unavailable on iOS: This channel uses technology (MPEG-DASH) not supported by Apple devices.");
                            return; 
                        }
                    }

                    if (fileType === 'mpd' && channel.keyId && channel.key) {
                        drmConfig = {
                            clearkey: {
                                keyId: channel.keyId,
                                key: channel.key
                            }
                        };
                    }

                    jwplayer("player").setup({
                        file: fileUrl,
                        type: fileType,
                        drm: drmConfig,
                        width: "100%",
                        aspectratio: "16:9",
                        autostart: true,
                        androidhls: true,
                        primary: 'html5' 
                    });
                };

                // Populate UI
                const select = document.getElementById('channelSelect');
                if (typeof channels !== 'undefined') {
                    Object.keys(channels).forEach(key => {
                        const option = document.createElement('option');
                        option.value = key;
                        option.textContent = channels[key].name;
                        select.appendChild(option);
                    });
                }

                select.addEventListener('change', function() {
                    loadStream(this.value);
                });

                // Hide Full Screen on iOS
                if (isIOS()) {
                    const fsBtn = document.getElementById('fullscreenBtn');
                    if (fsBtn) fsBtn.style.display = 'none';
                }

            } catch (error) {
                console.error("Error loading resources:", error);
            }
        }

        // Start initialization
        initApp();
    </script>
